version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: mariadb_container
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: sachin1605
      MARIADB_DATABASE: customer_db
    ports:
      - "3300:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    command: 
      - "--innodb-buffer-pool-size=1G"
      - "--innodb-log-file-size=256M"
      - "--innodb-flush-log-at-trx-commit=2"
      - "--max-connections=200"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  backend:
    build: ./backend
    container_name: backend_app_container
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/customer_db?rewriteBatchedStatements=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=sachin1605
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=false
      - JAVA_OPTS=-Xmx2G -Xms1G -XX:+UseG1GC
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G

  frontend:
    build: ./frontend
    container_name: frontend_app_container
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mariadb_data: